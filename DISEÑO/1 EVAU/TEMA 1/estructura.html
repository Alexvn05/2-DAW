<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div
        {
            margin: 5px;
        }
        .div1, .div5
        {
            background-color: rgb(79, 187, 46);
            width: 100%;
            height: 50px;
            float: left; /*Lo pone en modo columna*/
            text-align: center;
        }

        .div2, .div3
        {
            background-color: rgb(142, 46, 187);
            width: 40%;
            height: 700px;
            float: left; /*Lo pone en modo columna*/
        }

        .div4
        {
            background-color: rgb(86, 228, 228);
            width: 17%;
            height: 700px;
            float: right; /*Lo pone en modo columna*/
        }


    </style>
</head>
<body>
    <div class="div1">
        nav
    </div>
    <div class="div2">
        section 1
    </div>
    <div class="div3">
        section 2
    </div>
    <div class="div4">
        aside
    </div>
    <div class="div5">
        footer
    </div>
</body>
</html>
