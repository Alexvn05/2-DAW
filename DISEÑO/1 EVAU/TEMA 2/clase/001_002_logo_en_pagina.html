<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad 002 – Logo en la cabecera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #1f2937; }
    /* Logo arriba a la derecha, enlazando a la home (altura visual 24-48px en barra) */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid #e5e7eb; }
    .header__titles { flex: 1; }
    .header__logo { height: 48px; width: auto; display: block; }
    .main { padding: 24px; }
    h1 { font-size: 2rem; }
    h2 { font-size: 1.25rem; font-weight: 400; color: #4b5563; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__titles">
      <h1>Hola Mundo del desarrollo</h1>
      <h2>Subtítulo de la clase anterior</h2>
    </div>
    <a href="/" class="header__link">
      <!-- alt="" si junto al logo ya aparece el nombre de la marca en texto -->
      <img class="header__logo" src="logo.svg" alt="DW Studio – inicio">
    </a>
  </header>
  <main class="main">
    <p>Monograma (sección de prueba): <img src="monograma.svg" alt="Monograma DW" width="80"></p>
  </main>
</body>
</html>
