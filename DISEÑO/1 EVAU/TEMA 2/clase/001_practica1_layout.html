<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica 1 – Layout LOGO / NAV / ASIDE / BODY / ASIDE / FOOTER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; padding: 12px; }
  .page { display: grid; gap: 8px; max-width: 1000px; margin: auto; min-height: 90vh;
    grid-template-columns: 1fr 3fr 1fr; grid-template-rows: 70px 1fr 70px;
    grid-template-areas: "logo nav nav" "left body right" "foot foot foot"; }
  .page > * { border: 2px solid #222; display: grid; place-items: center; padding: 8px; }
  .logo { grid-area: logo; } .nav { grid-area: nav; }
  .aside--left { grid-area: left; } .body { grid-area: body; } .aside--right { grid-area: right; }
  .footer { grid-area: foot; }
  @media (max-width: 700px) {
    .page { grid-template-columns: 1fr; grid-template-rows: auto;
      grid-template-areas: "logo" "nav" "body" "left" "right" "foot"; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="logo">LOGO</header>
  <nav class="nav" aria-label="Principal">NAV</nav>
  <aside class="aside aside--left">ASIDE</aside>
  <main class="body">BODY</main>
  <aside class="aside aside--right">ASIDE</aside>
  <footer class="footer">FOOTER</footer>
</div>
</body>
</html>
