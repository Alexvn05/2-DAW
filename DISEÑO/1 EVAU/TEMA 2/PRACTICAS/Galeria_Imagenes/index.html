<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Imagenes con Flexbox y Grid</title>
</head>
<body>
    <header>
        <h1>Comparativa entre Flexbox y Grid</h1>
        <nav>
            <ul>
                <li><a href="#flex">Imagenes con Flexbox</a></li>
                <li><a href="#grid">Imagenes con Grid</a></li>
            </ul>
        </nav>
    </header>

    <div class="contenedor" id="flex">
        <div class="encabezado">
            <h2>1. Galeria con Flexbox</h2>
        </div>

        <div class="flex-imagenes">
            <div class="div-flex destacada">
                <img src="img/imagen1.jpg" alt="Estadio Bernabeu">
            </div>
            <div class="div-flex escudo movil-pequeño">
                <img src="img/imagen2.jpg" alt="Escudo Real Madrid">
            </div>
            <div class="div-flex escudo movil-pequeño">
                <img src="img/imagen3.jpg" alt="Escudo antiguo Real Madrid">
            </div>

            <div class="div-flex movil-pequeño">
                <img src="img/imagen4.jpg" alt="Camiseta blanca">
            </div>
            <div class="div-flex movil-pequeño">
                <img src="img/imagen5.jpg" alt="Camiseta verde">
            </div>
            <div class="div-flex movil-pequeño">
                <img src="img/imagen6.jpg" alt="Camiseta rosa">
            </div>
            <div class="div-flex movil-pequeño">
                <img src="img/imagen7.jpg" alt="Camiseta azul">
            </div>

            <div class="div-flex destacada movil-pequeño">
                <img src="img/imagen8.jpg" alt="Vitrina Champions League">
            </div>
            <div class="div-flex destacada">
                <img src="img/imagen9.jpg" alt="Cristiano Ronaldo">
            </div>
        </div>
    </div>

    <div class="contenedor" id="grid">
        <div class="encabezado">
            <h2>2. Galeria con CSS Grid</h2>
        </div>

        <div class="grid-imagenes">
            <div class="div-grid destacada">
                <img src="img/imagen10.jpg" alt="Estadio Camp Nou">
            </div>
            <div class="div-grid escudo">
                <img src="img/imagen11.jpg" alt="Escudo FC Barcelona">
            </div>
            <div class="div-grid escudo-antiguo movil-pequeño">
                <img src="img/imagen12.jpg" alt="Escudo antiguo FC Barcelona">
            </div>

            <div class="div-grid liverpool">
                <img src="img/imagen13.jpg" alt="Liverpool 4-0">
            </div>
            <div class="div-grid roma">
                <img src="img/imagen14.jpg" alt="Roma 3-0">
            </div>
            <div class="div-grid realmadrid">
                <img src="img/imagen15.jpg" alt="Madrid 4-0">
            </div>
            <div class="div-grid madrid">
                <img src="img/imagen16.jpg" alt="Madrid 5-1">
            </div>

            <div class="div-grid destacada">
                <img src="img/imagen17.jpg" alt="Titulo Barsa 8-2">
            </div>
            <div class="div-grid destacada messi">
                <img src="img/imagen18.jpg" alt="Messi aurafarming">
            </div>
        </div>
    </div>
    
</body>
</html>
