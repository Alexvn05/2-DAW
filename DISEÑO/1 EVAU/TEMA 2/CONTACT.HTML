<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card
        {
            width: 320px;
            margin-left: 20px;
            background-color: rgb(255, 1, 255);
            border-radius: 2em;

        }

        .card-top
        {
            background-color: rgb(155, 0, 155);
            height: 60px;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            
        }

        .card-body
        {
            padding: 0 20px 20px 20px;
        }

        img
        {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            margin: -40px auto 0 auto;

        }
        p, h2
        {
            margin-left: 20px;
        }

        p
        {
            padding-bottom: 20px;
        }

        h2
        {
            margin-top: 10px;
        }

        .cuadrado-am
        {
            margin-top: 50px;
            width: 300px;
            height: 300px;
            background-color: yellow;
        }

        .cuadrado-mo
        {
            background-color: purple;
            width: 290px;
            height: 290px;
            
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-top">

        </div>
        <img src="AV.jpeg">
        <div class="card-body">
            <h2>Lorem ipsus</h2>
            <p>dolor sit amet consectetur adipisicing elit. Rem impedit sequi vitae  voluptate impedit nobis architecto saepe eveniet enim laudantium illo repudiandae?</p>
        </div>
    </div>

    <div class="cuadrado-am">
        <div class="cuadrado-mo">

        </div>
    </div>
</body>
</html>
